name: Privacy request
description: See, correct or delete the analytics data apogee.avaui.dev holds about your visits.
labels: [privacy]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Don't write your name, email or anything else that identifies you.
        The analytics ID below is enough to find your data. How the site uses data: https://apogee.avaui.dev/privacy
  - type: dropdown
    id: request
    attributes:
      label: What you'd like
      options:
        - Delete my data
        - Send me a copy of my data
        - Correct my data
        - Something else
    validations:
      required: true
  - type: input
    id: analytics-id
    attributes:
      label: Your analytics ID
      description: Shown on https://apogee.avaui.dev/privacy if you accepted cookies. Without one, we hold nothing that links visits to you.
  - type: textarea
    id: details
    attributes:
      label: Anything else
